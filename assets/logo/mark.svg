<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FretCue mark">
  <title>FretCue</title>
  <!-- Map pin + open A minor chord diagram (Concept A). -->
  <defs>
    <clipPath id="pin-hole">
      <circle cx="64" cy="48" r="30"/>
    </clipPath>
  </defs>

  <!-- Pin body -->
  <path
    fill="#E5E5E5"
    d="M64 118
       C64 118 28 78 28 48
       a36 36 0 1 1 72 0
       C100 78 64 118 64 118Z"
  />

  <!-- Inner void -->
  <circle cx="64" cy="48" r="30" fill="#0A0A0A"/>

  <!--
    Am open chord (low E left -> high e right):
    E open | A open | D 2 | G 2 | B 1 | e open
    Guitar cues: thick nut + 6 vertical strings + frets.
  -->
  <g clip-path="url(#pin-hole)">
    <!-- 6 strings -->
    <g stroke="#A3A3A3" stroke-width="1.35" stroke-linecap="round">
      <line x1="43.5" y1="30" x2="43.5" y2="70"/>
      <line x1="51.5" y1="30" x2="51.5" y2="70"/>
      <line x1="59.5" y1="30" x2="59.5" y2="70"/>
      <line x1="67.5" y1="30" x2="67.5" y2="70"/>
      <line x1="75.5" y1="30" x2="75.5" y2="70"/>
      <line x1="83.5" y1="30" x2="83.5" y2="70"/>
    </g>

    <!-- Nut (the fretboard tell) -->
    <line x1="40" y1="32" x2="87" y2="32" stroke="#E5E5E5" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Frets -->
    <g stroke="#E5E5E5" stroke-width="1.7" stroke-linecap="round">
      <line x1="41" y1="44" x2="86" y2="44"/>
      <line x1="41" y1="56" x2="86" y2="56"/>
      <line x1="42" y1="68" x2="85" y2="68"/>
    </g>

    <!-- Fretted notes: D2, G2 (gray) + B1 ember cue -->
    <circle cx="59.5" cy="50" r="3.1" fill="#E5E5E5"/>
    <circle cx="67.5" cy="50" r="3.1" fill="#E5E5E5"/>
    <circle cx="75.5" cy="38" r="3.4" fill="#E07A3A"/>
  </g>
</svg>
